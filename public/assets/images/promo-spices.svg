<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="spiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1E05" />
      <stop offset="100%" stop-color="#B22222" />
    </linearGradient>
  </defs>
  <rect width="460" height="160" rx="14" fill="url(#spiceGrad)" />
  <circle cx="400" cy="80" r="110" fill="#FFA500" opacity="0.15" />
  <circle cx="430" cy="140" r="70" fill="#D4AF37" opacity="0.2" />

  <!-- Sinhala & English Promo Text -->
  <g transform="translate(24, 28)">
    <rect width="105" height="24" rx="12" fill="#D4AF37" />
    <text x="52" y="16" font-family="'Noto Sans Sinhala', sans-serif" font-size="10" font-weight="700" fill="#0B4F32" text-anchor="middle">විශේෂ දීමනා</text>

    <text x="0" y="55" font-family="'Noto Sans Sinhala', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">නැවුම් කුළුබඩු සහ තෙල්</text>
    <text x="0" y="78" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#FFD1BA">Pure Ceylon Spices &amp; Oils</text>
    
    <g transform="translate(0, 92)">
      <text x="0" y="14" font-family="'Inter', 'Noto Sans Sinhala', sans-serif" font-size="11" font-weight="700" fill="#F1C40F">15% දක්වා වට්ටම්  ➜</text>
    </g>
  </g>

  <!-- Illustration of Spice Jars and Chili -->
  <g transform="translate(320, 25)">
    <circle cx="65" cy="65" r="48" fill="#581502" />
    <!-- Spice Container -->
    <rect x="42" y="25" width="46" height="65" rx="7" fill="#F39C12" stroke="#FFFFFF" stroke-width="2" />
    <rect x="50" y="16" width="30" height="12" rx="3" fill="#D4AF37" />
    <rect x="47" y="45" width="36" height="25" rx="3" fill="#7B1E05" />
    <text x="65" y="61" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">SPICES</text>
    <!-- Cinnamon stick -->
    <line x1="25" y1="95" x2="65" y2="35" stroke="#8D6E63" stroke-width="8" stroke-linecap="round" />
    <!-- Red Chili -->
    <path d="M 18 65 C 22 85, 45 105, 50 110 C 45 100, 32 80, 28 65 Z" fill="#E74C3C" />
  </g>
</svg>
