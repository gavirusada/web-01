<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4F32" />
      <stop offset="45%" stop-color="#0E5E3C" />
      <stop offset="100%" stop-color="#063521" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0B4F32" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1C40F" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="720" height="380" fill="url(#heroBg)" rx="16" />
  
  <!-- Subtle Decorative Circles & Patterns -->
  <circle cx="560" cy="190" r="180" fill="url(#goldGlow)" />
  <circle cx="680" cy="60" r="120" fill="#4CAF50" opacity="0.08" />
  <circle cx="480" cy="320" r="90" fill="#D4AF37" opacity="0.06" />

  <!-- Background Pattern / Diagonal Lines -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="400" y1="0" x2="720" y2="320" />
    <line x1="440" y1="0" x2="720" y2="280" />
    <line x1="480" y1="0" x2="720" y2="240" />
    <line x1="520" y1="0" x2="720" y2="200" />
  </g>

  <!-- Hero Illustration Scene on Right Side -->
  <g transform="translate(420, 30)" filter="url(#softShadow)">
    
    <!-- Big Shopping Basket / Bag in Back -->
    <ellipse cx="140" cy="290" rx="120" ry="18" fill="#032014" opacity="0.4" />
    
    <!-- Wooden / Wicker Grocery Box -->
    <path d="M 40 180 L 240 180 L 225 285 C 223 292, 215 296, 205 296 L 75 296 C 65 296, 57 292, 55 285 Z" fill="#2E7D32" stroke="#4CAF50" stroke-width="2" />
    <line x1="45" y1="215" x2="235" y2="215" stroke="#4CAF50" stroke-width="1.5" opacity="0.6" />
    <line x1="50" y1="255" x2="230" y2="255" stroke="#4CAF50" stroke-width="1.5" opacity="0.6" />
    
    <!-- Milk & Oil Bottles -->
    <rect x="75" y="110" width="34" height="85" rx="6" fill="#FFFFFF" opacity="0.95" />
    <rect x="83" y="95" width="18" height="15" rx="3" fill="#D4AF37" />
    <rect x="80" y="140" width="24" height="30" rx="3" fill="#0B4F32" />
    <text x="83" y="158" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">MILK</text>
    
    <rect x="115" y="125" width="32" height="70" rx="6" fill="#F1C40F" opacity="0.9" />
    <rect x="123" y="112" width="16" height="13" rx="2" fill="#AA820A" />
    <rect x="120" y="150" width="22" height="25" rx="2" fill="#AA820A" opacity="0.7" />
    <text x="124" y="166" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">OIL</text>

    <!-- Loaf of Bread / Grains Sack -->
    <path d="M 150 145 C 150 115, 205 115, 205 145 L 205 190 L 150 190 Z" fill="#E67E22" />
    <path d="M 160 135 Q 170 140 180 135" stroke="#D35400" stroke-width="2" fill="none" />
    <path d="M 175 145 Q 185 150 195 145" stroke="#D35400" stroke-width="2" fill="none" />

    <!-- Fresh Red Apple & Orange -->
    <circle cx="70" cy="205" r="22" fill="#E74C3C" />
    <path d="M 70 183 C 70 178, 73 175, 75 174" stroke="#795548" stroke-width="2.5" fill="none" />
    <path d="M 73 177 C 78 174, 82 176, 84 179 C 81 183, 76 182, 73 177 Z" fill="#4CAF50" />
    
    <circle cx="108" cy="215" r="20" fill="#F39C12" />
    <circle cx="108" cy="215" r="18" fill="#E67E22" opacity="0.3" />

    <!-- Fresh Broccoli / Green Veggies -->
    <g transform="translate(145, 175)">
      <circle cx="20" cy="18" r="16" fill="#2ECC71" />
      <circle cx="36" cy="14" r="14" fill="#27AE60" />
      <circle cx="28" cy="4" r="15" fill="#4CAF50" />
      <rect x="24" y="24" width="8" height="20" rx="3" fill="#A5D6A7" />
    </g>

    <!-- Carrot with leafy top -->
    <g transform="translate(195, 185) rotate(25)">
      <path d="M 0 0 L 16 0 L 8 45 Z" fill="#E67E22" />
      <path d="M 4 -12 C 4 -5, 8 -2, 8 0" stroke="#2ECC71" stroke-width="2" fill="none" />
      <path d="M 8 -15 C 8 -7, 8 -2, 8 0" stroke="#27AE60" stroke-width="2.5" fill="none" />
      <path d="M 12 -12 C 12 -5, 8 -2, 8 0" stroke="#2ECC71" stroke-width="2" fill="none" />
    </g>

    <!-- Quality Guarantee Badge (Floating) -->
    <g transform="translate(170, 45)">
      <circle cx="35" cy="35" r="34" fill="url(#goldPlate)" />
      <circle cx="35" cy="35" r="29" fill="#0B4F32" />
      <text x="35" y="28" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#D4AF37" text-anchor="middle" letter-spacing="0.5">100%</text>
      <text x="35" y="39" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">FRESH</text>
      <text x="35" y="49" font-family="'Noto Sans Sinhala', sans-serif" font-size="7.5" font-weight="600" fill="#A5D6A7" text-anchor="middle">නැවුම් බව</text>
    </g>

    <!-- WhatsApp Quick Order Tag (Floating) -->
    <g transform="translate(10, 70)">
      <rect width="115" height="34" rx="17" fill="#25D366" filter="url(#softShadow)" />
      <circle cx="17" cy="17" r="11" fill="#FFFFFF" />
      <!-- WhatsApp Phone Shape inside -->
      <path d="M 14 11 C 12.5 11, 11 12.5, 11 14 C 11 18, 16 23, 20 23 C 21.5 23, 23 21.5, 23 20 L 20.5 18 L 19 19 C 17.5 18.2, 15.8 16.5, 15 15 L 16 13.5 Z" fill="#25D366" />
      <text x="35" y="21" font-family="'Noto Sans Sinhala', 'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">WhatsApp Order</text>
    </g>
  </g>
</svg>
