    <path d="M 20 18 C 17 11, 20 4, 26 1 C 28 8, 25 15, 20 18 Z" fill="url(#hdrLeaf)" />
    <path d="M 16 19 C 11 15, 10 7, 14 3 C 17 8, 17 14, 16 19 Z" fill="#4CAF50" />
