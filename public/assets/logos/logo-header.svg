    <line x1="8" y1="27" x2="32" y2="27" stroke="url(#hdrBasket)" stroke-width="1" opacity="0.8" />
    <line x1="10" y1="33" x2="30" y2="33" stroke="url(#hdrBasket)" stroke-width="1" opacity="0.8" />
  </g>

  <!-- Typography -->
  <g transform="translate(50, 8)">
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="19" font-weight="800" fill="#0B4F32" letter-spacing="-0.3">
