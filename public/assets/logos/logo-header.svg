      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <linearGradient id="hdrBasket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
  </defs>

  <!-- Compact Icon (Height ~40) -->
  <g transform="translate(4, 4)">
    <path d="M 8 22 C 8 9, 32 9, 32 22" fill="none" stroke="url(#hdrBasket)" stroke-width="2.6" stroke-linecap="round" />
